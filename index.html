      'ヌ': [[0.15,0.22,0.22,0.88],[0.40,0.30,0.85,0.88]],
      'ネ': [[0.48,0.08,0.50,0.22],[0.15,0.30,0.12,0.85],[0.48,0.30,0.46,0.92],[0.62,0.55,0.80,0.72]],
      'ノ': [[0.78,0.15,0.20,0.85]],
      'ハ': [[0.42,0.20,0.15,0.85],[0.58,0.30,0.88,0.85]],
      'ヒ': [[0.25,0.42,0.75,0.25],[0.25,0.12,0.85,0.82]],
      'フ': [[0.15,0.22,0.35,0.88]],
      'ヘ': [[0.12,0.62,0.88,0.42]],
      'ホ': [[0.12,0.32,0.88,0.30],[0.50,0.10,0.50,0.90],[0.30,0.50,0.15,0.85],[0.70,0.50,0.88,0.85]],
      'マ': [[0.15,0.22,0.30,0.62],[0.55,0.42,0.45,0.90]],
      'ミ': [[0.22,0.20,0.78,0.30],[0.25,0.45,0.80,0.55],[0.20,0.68,0.82,0.82]],
      'ム': [[0.55,0.18,0.25,0.72],[0.22,0.68,0.85,0.85]],
      'メ': [[0.78,0.15,0.18,0.88],[0.22,0.30,0.85,0.82]],
      'モ': [[0.22,0.25,0.75,0.22],[0.12,0.50,0.88,0.48],[0.55,0.12,0.80,0.78]],
      'ヤ': [[0.18,0.25,0.88,0.32],[0.58,0.08,0.48,0.92]],
      'ユ': [[0.20,0.25,0.72,0.75],[0.12,0.82,0.88,0.82]],
      'ヨ': [[0.18,0.20,0.82,0.82],[0.28,0.50,0.82,0.50],[0.18,0.82,0.82,0.82]],
      'ラ': [[0.25,0.18,0.70,0.18],[0.15,0.42,0.35,0.90]],
      'リ': [[0.28,0.15,0.25,0.70],[0.75,0.15,0.55,0.85]],
      'ル': [[0.28,0.20,0.25,0.80],[0.60,0.15,0.88,0.82]],
      'レ': [[0.28,0.10,0.85,0.55]],
      'ロ': [[0.18,0.20,0.18,0.82],[0.24,0.20,0.82,0.82],[0.20,0.82,0.82,0.82]],
      'ワ': [[0.14,0.30,0.10,0.70],[0.22,0.24,0.60,0.90]],
      'ヲ': [[0.15,0.22,0.85,0.20],[0.20,0.48,0.85,0.46],[0.70,0.48,0.35,0.88]],
      'ン': [[0.22,0.22,0.38,0.32],[0.22,0.78,0.85,0.22]],
      'ー': [[0.10,0.50,0.90,0.50]],
    };

    // だくてん(゛) は さいご に 2かく、はんだくてん(゜) は さいご に 1かく
    const DAKUTEN_STROKES = [[0.80,0.04,0.74,0.20],[0.93,0.04,0.87,0.20]];
    const HANDAKUTEN_STROKES = [[0.80,0.10,0.88,0.16]];

    const SMALL_KANA_BASE = {
      'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ',
      'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ヮ':'ワ',
    };

    // だくおん・はんだくおん・ちいさい もじ を もと の もじ から くみたてる
    const buildStrokeOrderTable = (base) => {
      const table = Object.assign({}, base);
      Object.keys(SMALL_KANA_BASE).forEach(small => {
        const src = base[SMALL_KANA_BASE[small]];
        if (src) table[small] = src;
      });
      [...HIRAGANA_DAKUON, ...KATAKANA_DAKUON].forEach(char => {
        const code = char.charCodeAt(0);
        const seion = base[String.fromCharCode(code - 1)];
        if (seion) { table[char] = seion.concat(DAKUTEN_STROKES); return; }
        const seionH = base[String.fromCharCode(code - 2)];
        if (seionH) table[char] = seionH.concat(HANDAKUTEN_STROKES);
      });
      return table;
    };

    const STROKE_ORDER = {
      hiragana: buildStrokeOrderTable(HIRAGANA_STROKE_ORDER),
      katakana: buildStrokeOrderTable(KATAKANA_STROKE_ORDER),
    };

    // ---------------------------------------------------------------
    // つきぬけ の きまり
    //   cross: [a, b] = 「a かくめ は b かくめ を つきぬける」
    //                   (0 から かぞえた かく の ばんごう)
    //   selfTail = 「の」 の よう に じぶん の せん と こうさ する もじ。
    //              こうさ した さき が でっぱり すぎて いない か を みる
    // ※ おてほん と かさなる ピクセル だけ を みて いると、せん が
    //    てまえ で とまって いて も ◯ に なって しまう ため べつ に はんてい する
    // ※ 「ね」「は」「ほ」「け」 の よう に、もともと はみだし が
    //    ほんの すこし の かく は きびしく しすぎない よう に いれない
    // ---------------------------------------------------------------
    const HIRAGANA_PENETRATION = {
      'あ': { cross: [[1, 0], [2, 1]] },
      'お': { cross: [[1, 0]] },
      'か': { cross: [[1, 0]] },
      'き': { cross: [[2, 0], [2, 1]] },
      'さ': { cross: [[1, 0]] },
      'す': { cross: [[1, 0]] },
      'せ': { cross: [[1, 0], [2, 0]] },
      'た': { cross: [[1, 0]] },
      'ち': { cross: [[1, 0]] },
      'な': { cross: [[1, 0]] },
      'ぬ': { cross: [[1, 0]] },
      'の': { selfTail: true },
      'ま': { cross: [[2, 0], [2, 1]] },
      'む': { cross: [[1, 0]] },
      'め': { cross: [[1, 0]] },
      'も': { cross: [[1, 0], [2, 0]] },
      'や': { cross: [[2, 0]] },
      'ゆ': { cross: [[1, 0]] },
      'よ': { cross: [[1, 0]] },
      'を': { cross: [[1, 0], [2, 1]] },
    };

    const KATAKANA_PENETRATION = {
      'オ': { cross: [[1, 0]] },
      'カ': { cross: [[1, 0]] },
      'キ': { cross: [[2, 0], [2, 1]] },
      'サ': { cross: [[1, 0], [2, 0]] },
      'セ': { cross: [[1, 0]] },
      'チ': { cross: [[2, 1]] },
      'ナ': { cross: [[1, 0]] },
      'ヌ': { cross: [[1, 0]] },
      'ホ': { cross: [[1, 0]] },
      'メ': { cross: [[1, 0]] },
      'モ': { cross: [[2, 0], [2, 1]] },
      'ヤ': { cross: [[1, 0]] },
    };

    // だくてん(゛)は 1つ まえ、はんだくてん(゜)は 2つ まえ が もと の もじ
    const HANDAKUON_CHARS = 'ぱぴぷぺぽパピプペポ';

    // だくてん・はんだくてん は さいご に つく ので かく の ばんごう は そのまま
    const buildPenetrationTable = (base) => {
      const table = Object.assign({}, base);
      Object.keys(SMALL_KANA_BASE).forEach(small => {
        const src = base[SMALL_KANA_BASE[small]];
        if (src) table[small] = src;
      });
      [...HIRAGANA_DAKUON, ...KATAKANA_DAKUON].forEach(char => {
        const back = HANDAKUON_CHARS.indexOf(char) >= 0 ? 2 : 1;
        const src = base[String.fromCharCode(char.charCodeAt(0) - back)];
        if (src) table[char] = src;
      });
      return table;
    };

    const PENETRATION = {
      hiragana: buildPenetrationTable(HIRAGANA_PENETRATION),
      katakana: buildPenetrationTable(KATAKANA_PENETRATION),
    };

    const getStrokeOrder = (charType, char) => {
      const data = STROKE_ORDER[charType][char];
      const count = charType === 'hiragana' ? HIRAGANA_STROKES[char] : KATAKANA_STROKES[char];
      // かくすう の ひょう と あわない ときは かきじゅん はんてい を しない
      return data && data.length === count ? data : null;
    };

    // すべて の せん を 「まんなか ぞろえ・おなじ おおきさ」 に そろえる
    const toUnitSpace = (strokes) => {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      strokes.forEach(pts => pts.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }));
      const scale = 1 / Math.max(maxX - minX, maxY - minY, 1e-6);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      return strokes.map(pts => ({
        sx: (pts[0].x - cx) * scale, sy: (pts[0].y - cy) * scale,
        ex: (pts[pts.length - 1].x - cx) * scale, ey: (pts[pts.length - 1].y - cy) * scale,
      }));
    };

    const strokeDistance = (a, b) =>
      Math.hypot(a.sx - b.sx, a.sy - b.sy) * 0.65 + Math.hypot(a.ex - b.ex, a.ey - b.ey) * 0.35;

    const PERMUTATION_CACHE = {};
    const getPermutations = (n) => {
      if (PERMUTATION_CACHE[n]) return PERMUTATION_CACHE[n];
      const result = [];
      const build = (current, rest) => {
        if (rest.length === 0) { result.push(current); return; }
        rest.forEach((v, i) => build(current.concat(v), rest.slice(0, i).concat(rest.slice(i + 1))));
      };
      build([], Array.from({ length: n }, (_, i) => i));
      PERMUTATION_CACHE[n] = result;
      return result;
    };

    // ユーザー が かいた せん を 「どの かく」 に あたる か わりあてて
    // その ならびが 1,2,3... の じゅん に なって いるか を みる
    const judgeStrokeOrder = (userPaths, expected, tolerance) => {
      const n = expected.length;
      if (tolerance === null || n < 2 || n > 6) return { ok: true, wrongIndex: -1 };
      if (userPaths.length !== n || userPaths.some(p => p.length === 0)) return { ok: true, wrongIndex: -1 };

      const user = toUnitSpace(userPaths);
      const model = toUnitSpace(expected.map(s => [{ x: s[0], y: s[1] }, { x: s[2], y: s[3] }]));

      const cost = (perm) => perm.reduce((sum, target, i) => sum + strokeDistance(user[i], model[target]), 0) / n;

      let bestPerm = null;
      let bestCost = Infinity;
      getPermutations(n).forEach(perm => {
        const c = cost(perm);
        if (c < bestCost) { bestCost = c; bestPerm = perm; }
      });

      const identityCost = cost(Array.from({ length: n }, (_, i) => i));
      if (identityCost - bestCost <= tolerance) return { ok: true, wrongIndex: -1 };

      const wrongIndex = bestPerm.findIndex((target, i) => target !== i);
      return { ok: false, wrongIndex };
    };

    // 「もっと ひだりうえ に かこう」 の よう な、ばしょ の なおしかた
    const positionHint = (offsetX, offsetY) => {
      const dir = [];
      if (offsetX > 0.08) dir.push('ひだり');
      else if (offsetX < -0.08) dir.push('みぎ');
      if (offsetY > 0.08) dir.push('うえ');
      else if (offsetY < -0.08) dir.push('した');
      return dir.length > 0 ? `もっと ${dir.join('')} に かこう` : 'まんなか の せん を めやす に かこう';
    };

    // 「ひだり から みぎ へ」 の よう な、かく の むき の いいかた
    const strokeDirectionHint = (dx, dy) => {
      const h = Math.abs(dx) > 0.12 ? (dx > 0 ? ['ひだり', 'みぎ'] : ['みぎ', 'ひだり']) : null;
      const v = Math.abs(dy) > 0.12 ? (dy > 0 ? ['うえ', 'した'] : ['した', 'うえ']) : null;
      if (h && v) return `${h[0]}${v[0]} から ${h[1]}${v[1]} へ`;
      if (h) return `${h[0]} から ${h[1]} へ`;
      if (v) return `${v[0]} から ${v[1]} へ`;
      return 'おてほん の むき に';
    };

    // かく の むき (ひだり→みぎ、うえ→した など) が ぎゃく に なって いないか
    //   mode 'axis' : よこぼう・たてぼう だけ みる
    //   mode 'all'  : ななめ の かく も みる
    // ※ てん や みじかい かく (だくてん など) は むき が さだまらない ので みない
    const DIRECTION_MIN_MODEL_LEN = 0.20;
    const DIRECTION_MIN_USER_LEN = 0.18;
    const DIRECTION_AXIS_BACK = 0.20;
    const DIRECTION_COS_LIMIT = -0.30;

    const judgeStrokeDirection = (userPaths, expected, mode) => {
      if (!mode || userPaths.length !== expected.length) return { ok: true, wrongIndex: -1 };

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      userPaths.forEach(path => path.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      }));
      const size = Math.max(maxX - minX, maxY - minY, 1);

      for (let i = 0; i < expected.length; i++) {
        const path = userPaths[i];
        if (!path || path.length < 2) continue;

        const mdx = expected[i][2] - expected[i][0];
        const mdy = expected[i][3] - expected[i][1];
        const modelLen = Math.hypot(mdx, mdy);
        if (modelLen < DIRECTION_MIN_MODEL_LEN) continue;

        const udx = (path[path.length - 1].x - path[0].x) / size;
        const udy = (path[path.length - 1].y - path[0].y) / size;
        const userLen = Math.hypot(udx, udy);
        if (userLen < DIRECTION_MIN_USER_LEN) continue;

        const horizontal = Math.abs(mdx) > Math.abs(mdy) * 1.5;
        const vertical = Math.abs(mdy) > Math.abs(mdx) * 1.5;
        if (mode !== 'all' && !horizontal && !vertical) continue;

        // まるごと ぎゃく むき に かいて いないか
        const cos = (mdx * udx + mdy * udy) / (modelLen * userLen);
        let reversed = cos < DIRECTION_COS_LIMIT;
        // よこぼう は ひだり→みぎ、たてぼう は うえ→した の むき も みる
        if (!reversed && horizontal && udx * mdx < 0 && Math.abs(udx) > DIRECTION_AXIS_BACK) reversed = true;
        if (!reversed && vertical && udy * mdy < 0 && Math.abs(udy) > DIRECTION_AXIS_BACK) reversed = true;

        if (reversed) return { ok: false, wrongIndex: i, hint: strokeDirectionHint(mdx, mdy) };
      }
      return { ok: true, wrongIndex: -1 };
    };

    // ---------------------------------------------------------------
    // つきぬけ の はんてい (せん と せん の こうさ を しらべる)
    // ---------------------------------------------------------------

    // せんぶん どうし が まじわる ところ (まじわらない ときは null)
    const segmentCross = (p1, p2, p3, p4) => {
      const ax = p2.x - p1.x, ay = p2.y - p1.y;
      const bx = p4.x - p3.x, by = p4.y - p3.y;
      const den = ax * by - ay * bx;
      if (Math.abs(den) < 1e-9) return null;
      const t = ((p3.x - p1.x) * by - (p3.y - p1.y) * bx) / den;
      const u = ((p3.x - p1.x) * ay - (p3.y - p1.y) * ax) / den;
      if (t < 0 || t > 1 || u < 0 || u > 1) return null;
      return { t, u, x: p1.x + ax * t, y: p1.y + ay * t };
    };

    // せん の はじめ から の ながさ の ひょう
    const pathLengths = (path) => {
      const acc = [0];
      for (let i = 1; i < path.length; i++) {
        acc.push(acc[i - 1] + Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y));
      }
      return acc;
    };

    const lengthAt = (acc, path, i, t) =>
      acc[i] + Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y) * t;

    // ちかすぎる てん を まびいて、こうさ しらべ を かるく する
    const PEN_SAMPLE_GAP = 3;
    const simplifyPath = (path) => {
      if (!path || path.length < 2) return path ? path.slice() : [];
      const out = [path[0]];
      for (let i = 1; i < path.length; i++) {
        const last = out[out.length - 1];
        if (Math.hypot(path[i].x - last.x, path[i].y - last.y) >= PEN_SAMPLE_GAP) out.push(path[i]);
      }
      const end = path[path.length - 1];
      const last = out[out.length - 1];
      if (last.x !== end.x || last.y !== end.y) out.push(end);
      return out;
    };

    // せん a と せん b が こうさ する ところ を さがす。
    // ふかさ = こうさてん から せん の りょうがわ に のこって いる ながさ
    // (a は 「つきぬける がわ」、b は 「つきぬけられる がわ」。
    //  b の はしっこ を かすめた だけ の こうさ を 「つきぬけ」 と しない ため
    //  b の ふかさ も みる が、a より ゆるく みる)
    const crossDepth = (pathA, pathB) => {
      if (!pathA || !pathB || pathA.length < 2 || pathB.length < 2) return null;
      const accA = pathLengths(pathA);
      const accB = pathLengths(pathB);
      const totalA = accA[accA.length - 1];
      const totalB = accB[accB.length - 1];
      if (totalA < 1e-6 || totalB < 1e-6) return null;
      let best = null;
      for (let i = 0; i + 1 < pathA.length; i++) {
        for (let j = 0; j + 1 < pathB.length; j++) {
          const hit = segmentCross(pathA[i], pathA[i + 1], pathB[j], pathB[j + 1]);
          if (!hit) continue;
          const la = lengthAt(accA, pathA, i, hit.t);
          const lb = lengthAt(accB, pathB, j, hit.u);
          const depthA = Math.min(la, totalA - la);
          const depthB = Math.min(lb, totalB - lb);
          const score = Math.min(depthA, depthB);
          if (!best || score > best.score) best = { score, depthA, depthB, x: hit.x, y: hit.y };
        }
      }
      return best;
    };

    // じぶん の せん と こうさ する ところ (「の」 の みぎうえ など)。
    // こうさてん から ちかい ほう の さきっぽ まで の ながさ を かえす
    const selfCrossReach = (path, minLoop) => {
      if (!path || path.length < 4) return null;
      const acc = pathLengths(path);
      let best = null;
      for (let i = 0; i + 1 < path.length; i++) {
        for (let j = i + 2; j + 1 < path.length; j++) {
          const hit = segmentCross(path[i], path[i + 1], path[j], path[j + 1]);
          if (!hit) continue;
          const loop = lengthAt(acc, path, j, hit.u) - lengthAt(acc, path, i, hit.t);
          if (loop < minLoop) continue;
          if (best && loop <= best.loop) continue;
          const head = Math.hypot(path[0].x - hit.x, path[0].y - hit.y);
          const tail = Math.hypot(path[path.length - 1].x - hit.x, path[path.length - 1].y - hit.y);
          best = { loop, reach: Math.min(head, tail) };
        }
      }
      return best;
    };

    // かいた せん を おてほん の どの かく に あてはめる か を きめる
    // (かきじゅん が ちがって いて も、かたち で ただしく くらべる ため)
    const matchStrokesToModel = (userPaths, expected) => {
      const n = expected.length;
      const identity = Array.from({ length: n }, (_, i) => i);
      if (userPaths.length !== n || n < 2 || n > 6) return identity;
      if (userPaths.some(p => !p || p.length === 0)) return identity;

      const user = toUnitSpace(userPaths);
      const model = toUnitSpace(expected.map(s => [{ x: s[0], y: s[1] }, { x: s[2], y: s[3] }]));

      let bestPerm = identity;
      let bestCost = Infinity;
      getPermutations(n).forEach(perm => {
        const c = perm.reduce((sum, target, i) => sum + strokeDistance(user[i], model[target]), 0);
        if (c < bestCost) { bestCost = c; bestPerm = perm; }
      });

      // perm[かいた ばんごう] = おてほん の ばんごう → ぎゃく に ならべかえる
      const map = identity.slice();
      bestPerm.forEach((modelIdx, userIdx) => { map[modelIdx] = userIdx; });
      return map;
    };

    // 「の」 の ような 1かく の わ で、みとめる わ の おおきさ (もじ の おおきさ ひ)
    const SELF_LOOP_MIN = 0.8;
    // つきぬけられる がわ の ふかさ は これ だけ ゆるく みる
    const CROSSED_DEPTH_RATIO = 0.6;

    const judgePenetration = (paths, char, charType, expected, size, level) => {
      const rules = PENETRATION[charType][char];
      const limit = level.penetrate;
      if (!rules || !limit) return { ok: true };

      const simple = paths.map(simplifyPath);

      if (rules.cross) {
        const map = matchStrokesToModel(paths, expected);
        for (let k = 0; k < rules.cross.length; k++) {
          const [a, b] = rules.cross[k];
          const pathA = simple[map[a]];
          const pathB = simple[map[b]];
          if (!pathA || !pathB || pathA.length < 2 || pathB.length < 2) continue;
          const hit = crossDepth(pathA, pathB);
          if (!hit || hit.depthA < limit.depth * size ||
              hit.depthB < limit.depth * CROSSED_DEPTH_RATIO * size) {
            return { ok: false, kind: 'missing', strokeA: a, strokeB: b };
          }
        }
      }

      if (rules.selfTail) {
        const self = selfCrossReach(simple[0], SELF_LOOP_MIN * size);
        if (self && self.reach > limit.tail * size) {
          return { ok: false, kind: 'tooMuch', strokeA: 0 };
        }
      }

      return { ok: true };
    };

    // おてほん の もじ が じっさい に えがかれる はんい を しらべる
    const glyphBoxCache = {};
    const getGlyphBox = (char) => {
      if (glyphBoxCache[char]) return glyphBoxCache[char];
      const canvas = document.createElement('canvas');
      canvas.width = CANVAS_SIZE;
      canvas.height = CANVAS_SIZE;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.font = KANA_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.fillText(char, CANVAS_SIZE / 2, CANVAS_SIZE / 2);
      const data = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let y = 0; y < CANVAS_SIZE; y += 2) {
        for (let x = 0; x < CANVAS_SIZE; x += 2) {
          if (data[(y * CANVAS_SIZE + x) * 4 + 3] > 50) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (minX === Infinity) return { x: 60, y: 60, w: CANVAS_SIZE - 120, h: CANVAS_SIZE - 120 };
      const box = { x: minX, y: minY, w: Math.max(maxX - minX, 1), h: Math.max(maxY - minY, 1) };
      glyphBoxCache[char] = box;
      return box;
    };

    // おてほん の ピクセル データ (もじ ごと に つかいまわす)
    //   core: もじ そのもの / fat: すこし ふとらせた もじ (はみだし はんてい よう)
    const targetDataCache = {};
    const getTargetData = (char, penSize) => {
      const key = `${char}:${penSize}`;
      if (targetDataCache[key]) return targetDataCache[key];
      const render = (borderWidth) => {
        const canvas = document.createElement('canvas');
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.font = KANA_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000000';
        ctx.fillText(char, CANVAS_SIZE / 2, CANVAS_SIZE / 2);
        if (borderWidth > 0) {
          ctx.lineWidth = borderWidth;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#000000';
          ctx.strokeText(char, CANVAS_SIZE / 2, CANVAS_SIZE / 2);
        }
        return ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
      };
      const data = {
        core: render(0),
        fat: render(Math.max(penSize * 2.5, 55)),
      };
      targetDataCache[key] = data;
      return data;
    };

    // フォント の よみこみ が おわったら、ふるい キャッシュ を すてる
    const clearJudgeCaches = () => {
      Object.keys(glyphBoxCache).forEach(k => delete glyphBoxCache[k]);
      Object.keys(targetDataCache).forEach(k => delete targetDataCache[k]);
    };

    const renderUserPaths = (paths, lineWidth) => {
      const canvas = document.createElement('canvas');
      canvas.width = CANVAS_SIZE;
      canvas.height = CANVAS_SIZE;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#000000';
      paths.forEach(path => {
        if (path.length === 0) return;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        if (path.length === 1) {
          ctx.lineTo(path[0].x, path[0].y + 0.1);
        } else {
          for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x, path[i].y);
          }
        }
        ctx.stroke();
      });
      return ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
    };

    // かいた もじ を おてほん の おおきさ・いち に そろえる
    // (かたち その もの を くらべる ため。ずれ の おおきさ は offset に のこす)
    const alignPathsToGlyph = (paths, char) => {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      paths.forEach(path => path.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      }));
      const box = getGlyphBox(char);
      const uw = Math.max(maxX - minX, 1);
      const uh = Math.max(maxY - minY, 1);
      const sizeRatio = Math.max(uw, uh) / Math.max(box.w, box.h);
      // たてよこ の バランス は くずさない よう に、おなじ ばいりつ で そろえる
      const scale = Math.min(2.2, Math.max(0.55, Math.min(box.w / uw, box.h / uh)));
      const ucx = (minX + maxX) / 2, ucy = (minY + maxY) / 2;
      const gcx = box.x + box.w / 2, gcy = box.y + box.h / 2;
      const aligned = paths.map(path => path.map(pt => ({
        x: gcx + (pt.x - ucx) * scale,
        y: gcy + (pt.y - ucy) * scale,
      })));
      // 十字マス の なか で 「かく ばしょ」 が どれだけ ずれて いるか
      // (もじ の おおきさ を 1 と した わりあい。ちいさい もじ でも きびしく なりすぎない
      //  よう に、ものさし に は さいてい でも マス の はんぶん を つかう)
      const offsetUnit = Math.max(box.w, box.h, CANVAS_SIZE * 0.55);
      const offsetX = (ucx - gcx) / offsetUnit;
      const offsetY = (ucy - gcy) / offsetUnit;
      return { aligned, sizeRatio, offsetX, offsetY, offsetRatio: Math.hypot(offsetX, offsetY) };
    };

    // ---------------------------------------------------------------
    // 1もじ ぶん の さいてん
    //   1. かくすう
    //   2. おおきさ (ちいさすぎ ない か)
    //   3. かく ばしょ (十字マス の なか で おおきく ずれて いない か)
    //   4. かたち (おてほん の せん の ちかく を とおって いるか / はみだし)
    //   5. かく むき (ひだり→みぎ、うえ→した を ぎゃく に かいて いない か)
    //   6. かきじゅん (レベル に よる)
    // ※ 3 と 5 は 「じけい が よくて も ✕」 に する ため、かたち と は べつ に みる
    // ---------------------------------------------------------------
    const judgeCharacter = (paths, char, charType, penSize, level) => {
      const targetStrokeCount = charType === 'hiragana' ? HIRAGANA_STROKES[char] : KATAKANA_STROKES[char];

      let totalPoints = 0;
      paths.forEach(path => { totalPoints += path.length; });
      if (totalPoints < 2) return { ok: false, reason: 'empty' };

      if (paths.length !== targetStrokeCount) {
        return { ok: false, reason: 'strokeCount', targetStrokeCount };
      }

      const { aligned, sizeRatio, offsetX, offsetY, offsetRatio } = alignPathsToGlyph(paths, char);
      if (sizeRatio < 0.45) return { ok: false, reason: 'small' };

      // 十字マス の なか で ばしょ が おおきく ずれて いたら、じけい が よくて も ✕
      if (offsetRatio > level.pos) {
        return { ok: false, reason: 'position', offsetX, offsetY, offsetRatio };
      }

      const { core: targetData, fat: targetDataFat } = getTargetData(char, penSize);
      const userData = renderUserPaths(aligned, penSize);
      // せん の いち ずれ を ゆるす ため、カバー はんてい は ふとい ペン で みる
      const userDataFat = renderUserPaths(aligned, Math.max(penSize * 2.2, 48));

      let targetPixelCount = 0;
      let coveredPixelCount = 0;
      let userPixelCount = 0;
      let userInsideFatCount = 0;
      const step = 4;

      for (let y = 0; y < CANVAS_SIZE; y += step) {
        for (let x = 0; x < CANVAS_SIZE; x += step) {
          const i = (y * CANVAS_SIZE + x) * 4 + 3;
          if (targetData[i] > 50) {
            targetPixelCount++;
            if (userDataFat[i] > 50) coveredPixelCount++;
          }
          if (userData[i] > 50) {
            userPixelCount++;
            if (targetDataFat[i] > 50) userInsideFatCount++;
          }
        }
      }

      const coverRate = targetPixelCount === 0 ? 0 : coveredPixelCount / targetPixelCount;
      const insideRate = userPixelCount === 0 ? 0 : userInsideFatCount / userPixelCount;
      const isNotCheating = userPixelCount < targetPixelCount * level.cheat;

      // かく が すくない もじ は 1ぼん の おもみ が おおきい ので すこし やさしく
      let coverThreshold = level.cover;
      if (targetStrokeCount <= 2) coverThreshold -= 0.08;
      else if (targetStrokeCount <= 4) coverThreshold -= 0.04;

      if (insideRate < level.inside || !isNotCheating) return { ok: false, reason: 'protrude', coverRate, insideRate };
      if (coverRate < coverThreshold) return { ok: false, reason: 'shape', coverRate, insideRate };

      const strokeOrderData = getStrokeOrder(charType, char);
      if (strokeOrderData) {
        // つきぬける はず の せん が とちゅう で とまって いないか /
        // つきぬけ なくて いい ところ が でっぱって いないか
        const box = getGlyphBox(char);
        const penResult = judgePenetration(
          aligned, char, charType, strokeOrderData, Math.max(box.w, box.h), level);
        if (!penResult.ok) {
          return { ok: false, reason: 'penetration', kind: penResult.kind,
            strokeA: penResult.strokeA, strokeB: penResult.strokeB, coverRate, insideRate };
        }

        const orderResult = judgeStrokeOrder(paths, strokeOrderData, level.orderTolerance);
        if (!orderResult.ok) return { ok: false, reason: 'order', wrongIndex: orderResult.wrongIndex, coverRate, insideRate };

        // かく を ぎゃく から かいて いたら、じけい が よくて も ✕
        const dirResult = judgeStrokeDirection(paths, strokeOrderData, level.direction);
        if (!dirResult.ok) {
          return { ok: false, reason: 'direction', wrongIndex: dirResult.wrongIndex, hint: dirResult.hint, coverRate, insideRate };
        }
      }

      return { ok: true, coverRate, insideRate };
    };

    // かきじゅん データ の はんい を、じっさい の もじ が えがかれる はんい に あわせる
    const makeStrokeMapper = (char, strokes) => {
      const box = getGlyphBox(char);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      strokes.forEach(s => [[s[0], s[1]], [s[2], s[3]]].forEach(([x, y]) => {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }));
      const rangeX = maxX - minX;
      const rangeY = maxY - minY;
      return (x, y) => ({
        x: box.x + (rangeX < 1e-6 ? 0.5 : (x - minX) / rangeX) * box.w,
        y: box.y + (rangeY < 1e-6 ? 0.5 : (y - minY) / rangeY) * box.h,
      });
    };

    const drawStrokeNumbers = (ctx, char, strokes, strong) => {
      const toCanvas = makeStrokeMapper(char, strokes);

      // ばんごう が かさなる ときは かく の むき に すこし ずらす
      const placed = [];
      strokes.forEach(stroke => {
        const from = toCanvas(stroke[0], stroke[1]);
        const to = toCanvas(stroke[2], stroke[3]);
        let t = 0;
        let pos = from;
        while (t < 0.5 && placed.some(p => Math.hypot(p.x - pos.x, p.y - pos.y) < 46)) {
          t += 0.1;
          pos = { x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t };
        }
        placed.push(pos);
      });

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      placed.forEach((pos, i) => {
        const cx = pos.x;
        const cy = pos.y;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fillStyle = strong ? 'rgba(224, 122, 95, 0.95)' : 'rgba(129, 178, 154, 0.75)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px "M PLUS Rounded 1c", sans-serif';
        ctx.fillText(String(i + 1), cx, cy + 1);
      });
      ctx.restore();
    };

    // かいはつ・テスト よう の フック (アプリ の うごき には えいきょう しない)
    window.__mojiNoteTest = {
      judgeCharacter, judgeStrokeOrder, judgeStrokeDirection, alignPathsToGlyph, getGlyphBox,
      makeStrokeMapper, positionHint, strokeDirectionHint,
      judgePenetration, crossDepth, selfCrossReach, matchStrokesToModel,
      getStrokeOrder, DIFFICULTY_LEVELS, HIRAGANA_STROKES, KATAKANA_STROKES, STROKE_ORDER,
      PENETRATION,
    };

    const App = () => {
      const [isFontLoaded, setIsFontLoaded] = useState(false);
      useEffect(() => {
        let cancelled = false;
        Promise.all([document.fonts.load('10px "Klee One"'), document.fonts.ready]).then(() => {
          if (cancelled) return;
          // フォント よみこみ まえ に つくった おてほん キャッシュ を すてて かきなおす
          clearJudgeCaches();
          setIsFontLoaded(true);
        });
        return () => { cancelled = true; };
      }, []);

      const [gameState, setGameState] = useState('TITLE'); 
      const [charType, setCharType] = useState('hiragana');
      const [playMode, setPlayMode] = useState('char');
      
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [currentStep, setCurrentStep] = useState('trace'); 

      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');
      const [hasMistaked, setHasMistaked] = useState(false);
      
      const [penSize, setPenSize] = useState(25);
      const [difficultyKey, setDifficultyKey] = useState('normal');
      const [useDakuon, setUseDakuon] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      
      const bgCanvasRefs = useRef([]);
      const drawCanvasRefs = useRef([]);
      const pathsRef = useRef([]);
      const currentPathRef = useRef([]);
      
      const isDrawingRef = useRef(false);
      const activeCanvasIndexRef = useRef(null);

      const level = DIFFICULTY_LEVELS[difficultyKey];

      const targetChars = questions.length > 0 
        ? (playMode === 'char' ? [questions[currentIndex]] : questions[currentIndex].split(''))
        : [];

      const addScoreToLocal = () => {
        const currentScore = parseInt(localStorage.getItem('gogo_drill_score') || '0', 10);
        localStorage.setItem('gogo_drill_score', currentScore + 1);
      };

      const startGame = (mode) => {
        setPlayMode(mode);
        let qList = [];
        
        if (mode === 'char') {
          let chars = charType === 'hiragana' ? [...HIRAGANA_SEION] : [...KATAKANA_SEION];
          if (useDakuon) {
            chars = chars.concat(charType === 'hiragana' ? HIRAGANA_DAKUON : KATAKANA_DAKUON);
          }
          qList = shuffleArray(chars).slice(0, 10);
        } else {
          let words = charType === 'hiragana' ? HIRAGANA_WORDS : KATAKANA_WORDS;
          if (!useDakuon) {
            words = words.filter(word => !DAKUON_REGEX.test(word));
          }
          qList = shuffleArray(words).slice(0, 5);
        }
        
        setQuestions(qList);
        setCurrentIndex(0);
        setCurrentStep('trace');
        setScore(0);
        setHasMistaked(false);
        setGameState('PRACTICE');
        setFeedback(null);
        setErrorMessage('');
      };

      const goToNext = () => {
        setFeedback(null);
        setErrorMessage('');
        
        if (currentStep === 'trace') {
          setCurrentStep('blind');
          setHasMistaked(false);
        } else if (currentStep === 'retry_trace') {
          setCurrentStep('blind');
        } else {
          setCurrentStep('trace');
          setHasMistaked(false);
          if (currentIndex + 1 < questions.length) {
            setCurrentIndex(i => i + 1);
          } else {
            setGameState('RESULT');
          }
        }
      };

      const skipQuestion = () => {
        setFeedback(null);
        setErrorMessage('');
        pathsRef.current = [];
        currentPathRef.current = [];
        setCurrentStep('trace');
        setHasMistaked(false);
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(i => i + 1);
        } else {
          setGameState('RESULT');
        }
      };

      useEffect(() => {
        if (gameState === 'PRACTICE' && targetChars.length > 0) {
          clearCanvas();
        }
      }, [gameState, currentIndex, currentStep, questions, isFontLoaded]);

      const clearCanvas = () => {
        pathsRef.current = Array.from({ length: targetChars.length }, () => []);
        currentPathRef.current = [];
        isDrawingRef.current = false;
        activeCanvasIndexRef.current = null;
        
        targetChars.forEach((char, idx) => {
          const drawCanvas = drawCanvasRefs.current[idx];
          if (drawCanvas) {
            const drawCtx = drawCanvas.getContext('2d');
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          }
          
          const bgCanvas = bgCanvasRefs.current[idx];
          if (bgCanvas) {
            const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = '#ffffff';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.save();
            bgCtx.strokeStyle = '#81B29A';
            bgCtx.globalAlpha = 0.5;
            bgCtx.lineWidth = 2;
            bgCtx.setLineDash([8, 8]);
            bgCtx.beginPath();
            bgCtx.moveTo(bgCanvas.width / 2, 0);
            bgCtx.lineTo(bgCanvas.width / 2, bgCanvas.height);
            bgCtx.moveTo(0, bgCanvas.height / 2);
            bgCtx.lineTo(bgCanvas.width, bgCanvas.height / 2);
            bgCtx.stroke();
            bgCtx.restore();

            if (char) {
              bgCtx.font = KANA_FONT;
              bgCtx.textAlign = 'center';
              bgCtx.textBaseline = 'middle';

              if (currentStep === 'trace') {
                bgCtx.fillStyle = 'rgba(61, 64, 91, 0.15)';
                bgCtx.fillText(char, bgCanvas.width / 2, bgCanvas.height / 2);
              } else if (currentStep === 'retry_trace') {
                bgCtx.fillStyle = 'rgba(224, 122, 95, 0.25)';
                bgCtx.fillText(char, bgCanvas.width / 2, bgCanvas.height / 2);
              }

              // おてほん を みる ステップ では かきじゅん の ばんごう も みせる
              const strokes = getStrokeOrder(charType, char);
              if (strokes && strokes.length > 1 && currentStep !== 'blind') {
                drawStrokeNumbers(bgCtx, char, strokes, currentStep === 'retry_trace');
              }
            }
          }
        });
      };

      const getCoordinates = (e, index) => {
        const canvas = drawCanvasRefs.current[index];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDrawing = (e, index) => {
        if (feedback !== null) return;
        isDrawingRef.current = true;
        activeCanvasIndexRef.current = index;
        const { x, y } = getCoordinates(e, index);
        currentPathRef.current = [{ x, y }];
        
        const ctx = drawCanvasRefs.current[index].getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + 0.1); 
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#3D405B';
        ctx.stroke();
      };

      const draw = (e, index) => {
        if (!isDrawingRef.current || feedback !== null || activeCanvasIndexRef.current !== index) return;
        const { x, y } = getCoordinates(e, index);
        currentPathRef.current.push({ x, y });
        
        const ctx = drawCanvasRefs.current[index].getContext('2d');
        ctx.lineTo(x, y);
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#3D405B';
        ctx.stroke();
      };

      const stopDrawing = (e, index) => {
        if (!isDrawingRef.current || activeCanvasIndexRef.current !== index) return;
        isDrawingRef.current = false;
        activeCanvasIndexRef.current = null;
        if (currentPathRef.current.length > 0) {
          pathsRef.current[index].push([...currentPathRef.current]);
          currentPathRef.current = [];
        }
      };

      const checkWriting = () => {
        if (feedback !== null) return;
        let allCorrect = true;
        let hasNoInput = false;
        let firstErrorMsg = '';

        targetChars.forEach((char, idx) => {
          const result = judgeCharacter(pathsRef.current[idx] || [], char, charType, penSize, level);
          if (result.ok) return;

          allCorrect = false;
          if (result.reason === 'empty') {
            hasNoInput = true;
            return;
          }
          if (!firstErrorMsg) {
            const displayIdx = targetChars.length > 1 ? `${idx + 1}もじめの ` : '';
            if (result.reason === 'strokeCount') {
              firstErrorMsg = `${displayIdx}かくすう が ちがうよ！\n(せいかいは ${result.targetStrokeCount} かく)`;
            } else if (result.reason === 'order') {
              firstErrorMsg = `${displayIdx}かきじゅん が ちがうよ！\n(${result.wrongIndex + 1} かくめ を みてね)`;
            } else if (result.reason === 'direction') {
              firstErrorMsg = `${displayIdx}かく むき が ぎゃく だよ！\n(${result.wrongIndex + 1} かくめ は ${result.hint})`;
            } else if (result.reason === 'penetration') {
              firstErrorMsg = result.kind === 'tooMuch'
                ? `${displayIdx}つきぬけ すぎ だよ！\n(さきっぽ を ながく ださないでね)`
                : `${displayIdx}つきぬけて いないよ！\n(${result.strokeA + 1} かくめ は ${result.strokeB + 1} かくめ を つきぬけよう)`;
            } else if (result.reason === 'position') {
              firstErrorMsg = `${displayIdx}かく ばしょ が ずれて いるよ！\n(${positionHint(result.offsetX, result.offsetY)})`;
            } else if (result.reason === 'small') {
              firstErrorMsg = `${displayIdx}もっと おおきく かいてみよう！`;
            } else if (result.reason === 'protrude') {
              firstErrorMsg = `${displayIdx}はみだし が おおいみたい`;
            } else {
              firstErrorMsg = `${displayIdx}かたちが すこし ちがうみたい`;
            }
          }
        });

        if (hasNoInput) {
          setFeedback('❌');
          setErrorMessage('かいていない マスが あるよ！');
          setTimeout(() => {
            setFeedback(null);
            setErrorMessage('');
          }, 2500);
          return;
        }

        if (allCorrect) {
          setFeedback('⭕️');
          if (currentStep !== 'retry_trace' && !hasMistaked) {
            setScore(s => s + 1);
            addScoreToLocal(); 
          }
          setTimeout(() => {
            goToNext();
          }, 1500);
        } else {
          setFeedback('❌');
          setErrorMessage(firstErrorMsg);
          setHasMistaked(true);
          
          if (currentStep === 'blind') {
            targetChars.forEach((char, idx) => {
              const bgCanvas = bgCanvasRefs.current[idx];
              if (bgCanvas) {
                const bgCtx = bgCanvas.getContext('2d');
                bgCtx.font = KANA_FONT;
                bgCtx.textAlign = 'center';
                bgCtx.textBaseline = 'middle';
                bgCtx.fillStyle = 'rgba(224, 122, 95, 0.4)';
                bgCtx.fillText(char, bgCanvas.width / 2, bgCanvas.height / 2);
                const strokes = getStrokeOrder(charType, char);
                if (strokes && strokes.length > 1) drawStrokeNumbers(bgCtx, char, strokes, true);
              }
            });
          }

          setTimeout(() => {
            setFeedback(null);
            setErrorMessage('');
            if (currentStep === 'blind') {
              setCurrentStep('retry_trace');
            } else {
              clearCanvas();
            }
          }, 2500);
        }
      };

      const maxScore = questions.length * 2; 

      return (
        <div className="w-full h-full flex flex-col items-center justify-center relative overflow-hidden bg-cork">
          
          {(gameState === 'TITLE' || gameState === 'MODE_SELECT') && (
            <>
              <button onClick={() => window.location.href = 'https://hot-spring-egg.github.io/ontama-drill/'} className="absolute top-4 left-4 sm:top-6 sm:left-6 bg-white/90 text-bluegrey px-4 py-2 rounded-full font-bold shadow-sm hover:shadow-md transition-all z-40 border border-gray-200 text-sm sm:text-base">
                ← ドリルにもどる
              </button>
              <button onClick={() => setIsSettingsOpen(true)} className="absolute top-4 right-4 sm:top-6 sm:right-6 bg-white/80 text-bluegrey w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-2xl sm:text-3xl shadow-sm hover:shadow-md transition-all z-40 border border-gray-200">
                ⚙️
              </button>
            </>
          )}

          {isSettingsOpen && (
            <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-paper p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md relative animate-pop-in border border-white max-h-[90vh] overflow-y-auto">
                <h2 className="font-rounded text-2xl sm:text-3xl font-bold mb-6 text-center text-bluegrey border-b-2 border-sage pb-2">せってい</h2>
                <div className="mb-8"><p className="font-rounded text-bluegrey/80 mb-3 text-lg sm:text-xl text-center">もんだいの しゅるい</p><button onClick={() => setUseDakuon(!useDakuon)} className={`w-full py-4 px-4 rounded-xl border-2 font-rounded font-bold text-lg transition-all flex flex-col items-center justify-center gap-1 ${useDakuon ? 'bg-sage border-sage text-white shadow-inner' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'}`}><span>だくおん・はんだくおん</span><span className="text-sm font-normal opacity-90">(が・ぱ など 点々や丸がつく文字)</span><span className="mt-1 text-base">{useDakuon ? 'ON (でる)' : 'OFF (でない)'}</span></button></div>
                <div className="mb-8"><p className="font-rounded text-bluegrey/80 mb-3 text-lg sm:text-xl text-center">ペンの ふとさ</p><div className="flex justify-center gap-4 sm:gap-6">{[{ size: 15, label: 'ほそい' }, { size: 25, label: 'ふつう' }, { size: 35, label: 'ふとい' }].map(p => (<button key={p.size} onClick={() => setPenSize(p.size)} className={`w-20 h-20 rounded-full flex flex-col items-center justify-center border-2 transition-all ${penSize === p.size ? 'bg-sage border-sage text-white shadow-inner scale-110' : 'bg-white border-gray-300 text-gray-400 hover:bg-gray-50'}`}><div className="bg-current rounded-full mb-1" style={{ width: p.size/3, height: p.size/3 }}></div><span className="font-rounded text-xs">{p.label}</span></button>))}</div></div>
                <div className="mb-8">
                  <p className="font-rounded text-bluegrey/80 mb-3 text-lg sm:text-xl text-center">はんていの レベル</p>
                  <div className="flex justify-center gap-2 sm:gap-3">
                    {Object.keys(DIFFICULTY_LEVELS).map(key => (
                      <button key={key} onClick={() => setDifficultyKey(key)} className={`flex-1 px-2 py-3 rounded-xl border-2 transition-all flex flex-col items-center justify-start gap-1 ${difficultyKey === key ? 'bg-sage border-sage text-white shadow-inner' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'}`}>
                        <span className="font-rounded font-bold text-sm sm:text-base">{DIFFICULTY_LEVELS[key].label}</span>
                        <span className="font-rounded text-[10px] sm:text-xs leading-tight text-center whitespace-pre-line opacity-90">{DIFFICULTY_LEVELS[key].desc}</span>
                      </button>
                    ))}
                  </div>
                  <p className="font-rounded text-xs sm:text-sm text-bluegrey/60 mt-3 text-center leading-relaxed">{DIFFICULTY_LEVELS[difficultyKey].hint}</p>
                </div>
                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-terracotta text-white font-rounded py-4 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-xl transition-all">とじる</button>
              </div>
            </div>
          )}

          {gameState === 'TITLE' && (
            <div className="w-full h-full flex flex-col items-center justify-center p-4">
              <div className="bg-paper px-8 py-4 sm:py-6 rounded-sm shadow-md mb-8 transform -rotate-1 relative mt-12"><div className="masking-tape"></div><h1 className="font-rounded text-4xl sm:text-5xl font-bold text-bluegrey tracking-wider">モジノート</h1></div>
              <p className="font-rounded text-white bg-bluegrey/80 px-4 py-1 rounded-full mb-8 text-sm sm:text-base">どちら を れんしゅう する？</p>
              <div className="w-full max-w-sm flex flex-col gap-6">
                <button onClick={() => { setCharType('hiragana'); setGameState('MODE_SELECT'); }} className="w-full bg-paper aspect-[3/1] rounded-sm flex flex-col items-center justify-center relative shadow-md hover:-translate-y-1 hover:shadow-lg transition-all border border-gray-200"><div className="pin pin-blue"></div><span className="font-rounded text-3xl sm:text-4xl font-bold text-sage">ひらがな</span></button>
                <button onClick={() => { setCharType('katakana'); setGameState('MODE_SELECT'); }} className="w-full bg-paper aspect-[3/1] rounded-sm flex flex-col items-center justify-center relative shadow-md hover:-translate-y-1 hover:shadow-lg transition-all border border-gray-200 rotate-[1deg]"><div className="pin pin-yellow"></div><span className="font-rounded text-3xl sm:text-4xl font-bold text-terracotta">カタカナ</span></button>
              </div>
            </div>
          )}

          {gameState === 'MODE_SELECT' && (
            <div className="w-full h-full flex flex-col items-center justify-center p-4">
              <div className="bg-white px-6 py-3 rounded-full shadow-sm border border-gray-100 flex flex-col items-center mb-8 relative mt-12"><h2 className={`font-rounded text-2xl sm:text-3xl font-bold border-b-2 pb-1 ${charType === 'hiragana' ? 'text-sage border-sage' : 'text-terracotta border-terracotta'}`}>{charType === 'hiragana' ? 'ひらがな' : 'カタカナ'} の ノート</h2></div>
              <div className="w-full max-w-sm flex flex-col gap-6">
                <button onClick={() => startGame('char')} className="w-full bg-mustard text-white font-rounded py-5 rounded-xl shadow-md active:translate-y-1 active:shadow-sm flex flex-col items-center gap-1 transition-all border-4 border-white"><span className="text-2xl sm:text-3xl font-bold">1もじずつ</span><span className="text-sm sm:text-base">(10もん)</span></button>
                <button onClick={() => startGame('word')} className="w-full bg-bluegrey text-white font-rounded py-5 rounded-xl shadow-md active:translate-y-1 active:shadow-sm flex flex-col items-center gap-1 transition-all border-4 border-white"><span className="text-2xl sm:text-3xl font-bold">ことば で</span><span className="text-sm sm:text-base">(5もん)</span></button>
                <button onClick={() => setGameState('TITLE')} className="mt-4 font-rounded text-bluegrey/70 underline hover:text-bluegrey text-lg">← もどる</button>
              </div>
            </div>
          )}

          {gameState === 'PRACTICE' && questions.length > 0 && (
            <div className="w-full h-full flex flex-col p-2 sm:p-4 relative">
              <div className="w-full max-w-7xl mx-auto flex-1 flex flex-col items-center bg-paper rounded-sm shadow-xl text-gray-900 p-2 sm:p-4 overflow-hidden relative animate-open-note border border-white">
                <div className="w-full flex justify-between items-center font-rounded text-base sm:text-xl text-bluegrey/70 mb-1 px-2 shrink-0">
                  <button onClick={() => setGameState('MODE_SELECT')} className="underline hover:text-bluegrey" disabled={feedback !== null}>←やめる</button>
                  <div className="flex gap-4 font-bold"><span>{currentIndex + 1} / {questions.length}</span><span>スコア: {score}</span></div>
                </div>
                <div className={`font-rounded font-bold text-lg sm:text-2xl mb-1 px-6 py-1 rounded-full shrink-0 ${currentStep === 'trace' ? 'bg-sage/20 text-sage' : currentStep === 'blind' ? 'bg-bluegrey/10 text-bluegrey' : 'bg-terracotta/20 text-terracotta'}`}>
                  {currentStep === 'trace' && '① なぞって かこう！'}
                  {currentStep === 'blind' && '② おてほん なしで かこう！'}
                  {currentStep === 'retry_trace' && '★ あか文字 を なぞって かくにん！'}
                </div>
                {feedback && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-50 bg-white/40 backdrop-blur-sm">
                    <span className={`text-[9rem] sm:text-[12rem] drop-shadow-lg opacity-95 leading-none ${feedback === '⭕️' ? 'text-sage' : 'text-terracotta'}`}>{feedback}</span>
                    {errorMessage && <div className="mt-4 bg-white px-6 py-3 rounded-2xl border-4 border-terracotta text-terracotta font-rounded font-bold text-xl sm:text-2xl text-center whitespace-pre-wrap shadow-xl">{errorMessage}</div>}
                  </div>
                )}
                <div className="w-full flex-1 flex justify-center items-center gap-2 sm:gap-4 my-1 min-h-0">
                  {targetChars.map((char, idx) => {
                    let maxWidth = 'min(80vw, 55vh)'; 
                    if (playMode === 'word') { maxWidth = targetChars.length === 2 ? 'min(42vw, 55vh)' : 'min(28vw, 55vh)'; }
                    return (
                      <div key={idx} className="relative rounded-2xl aspect-square shadow-md overflow-hidden bg-white border-2 border-gray-200 shrink-0" style={{ width: '100%', maxWidth: maxWidth }}>
                        <canvas ref={el => bgCanvasRefs.current[idx] = el} width={CANVAS_SIZE} height={CANVAS_SIZE} className="absolute top-0 left-0 w-full h-full pointer-events-none" />
                        <canvas ref={el => drawCanvasRefs.current[idx] = el} width={CANVAS_SIZE} height={CANVAS_SIZE} onMouseDown={(e) => startDrawing(e, idx)} onMouseMove={(e) => draw(e, idx)} onMouseUp={(e) => stopDrawing(e, idx)} onMouseOut={(e) => stopDrawing(e, idx)} onTouchStart={(e) => startDrawing(e, idx)} onTouchMove={(e) => draw(e, idx)} onTouchEnd={(e) => stopDrawing(e, idx)} onTouchCancel={(e) => stopDrawing(e, idx)} className="cursor-crosshair absolute top-0 left-0 w-full h-full touch-none" />
                      </div>
                    );
                  })}
                </div>
                <div className="flex gap-2 sm:gap-4 w-full justify-center shrink-0 pt-2 pb-1 px-2">
                  <button onClick={skipQuestion} disabled={feedback !== null} className="bg-bluegrey/80 text-white font-rounded py-3 px-4 sm:px-8 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-base sm:text-xl transition-all">とばす</button>
                  <button onClick={clearCanvas} disabled={feedback !== null} className="bg-gray-300 text-gray-700 font-rounded py-3 px-6 sm:px-10 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-base sm:text-xl transition-all">けす</button>
                  <button onClick={checkWriting} disabled={feedback !== null} className="bg-terracotta text-white font-rounded py-3 px-8 sm:px-14 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-lg sm:text-2xl font-bold transition-all">できた！</button>
                </div>
              </div>
            </div>
          )}

          {gameState === 'RESULT' && (
            <div className="w-full h-full flex flex-col p-4 sm:p-8 relative">
              <div className="w-full max-w-lg mx-auto flex-1 flex flex-col items-center justify-center bg-paper rounded-sm shadow-xl text-gray-900 p-6 overflow-hidden relative animate-open-note border border-white">
                <h2 className="font-rounded text-3xl sm:text-4xl font-bold mb-8 text-bluegrey border-b-2 border-sage pb-2">けっか はっぴょう</h2>
                <p className="text-[5rem] sm:text-[7rem] font-bold text-terracotta mb-4 leading-none drop-shadow-sm flex items-baseline gap-2">
                  {score} <span className="text-3xl sm:text-4xl text-bluegrey">/ {maxScore} てん</span>
                </p>
                <p className="font-rounded text-xl sm:text-2xl mb-12 text-sage font-bold">
                  {score === maxScore ? 'パーフェクト！すごいぞ！' : 'よくがんばったね！'}
                </p>
                <button onClick={() => setGameState('TITLE')} className="bg-bluegrey text-white font-rounded px-8 py-4 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-xl w-full max-w-xs">
                  ノートをとじる
                </button>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
